name: ${DOLPHIN_COMPOSE_PROJECT_NAME:?DOLPHIN_COMPOSE_PROJECT_NAME must name the approved stable Compose project}

x-django-environment: &django-environment
  DJANGO_SETTINGS_MODULE: config.production_settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
  DOLPHIN_PUBLIC_HOST: ${DOLPHIN_PUBLIC_HOST}
  AUDIT_TRUSTED_PROXY_CIDRS: ${AUDIT_TRUSTED_PROXY_CIDRS:-}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  DOLPHIN_HSTS_HEADER: ${DOLPHIN_HSTS_HEADER}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-3}
  POSTGRES_INIT_USER: ${POSTGRES_INIT_USER}
  POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER}
  POSTGRES_APP_USER: ${POSTGRES_APP_USER}
  # Deployment profile (PROFILE-001, Option C). The signed manifest is mounted
  # read-only and is the sole source of truth for feature availability; only
  # public verification keys are configured here. Production refuses to start
  # without a manifest that verifies.
  DOLPHIN_DEPLOYMENT_MANIFEST: /profile/manifest.json
  DOLPHIN_DEPLOYMENT_MANIFEST_KEYS: ${DOLPHIN_DEPLOYMENT_MANIFEST_KEYS:?DOLPHIN_DEPLOYMENT_MANIFEST_KEYS must list the trusted key_id:base64_public_key pairs}
  # Transport security to PostgreSQL. Empty keeps libpq's default, which is
  # right here because `backend` is an internal network the database never
  # leaves. A split app/database deployment must set verify-full and mount a CA.
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
  POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
  # Server-generated PDF. Off unless the image actually contains a browser;
  # browser print / save-as-PDF works either way.
  DOLPHIN_PDF_RENDERER: ${DOLPHIN_PDF_RENDERER:-}
  DOLPHIN_PDF_CHROMIUM_BINARY: ${DOLPHIN_PDF_CHROMIUM_BINARY:-}
  DOLPHIN_PDF_RENDER_TIMEOUT_SECONDS: ${DOLPHIN_PDF_RENDER_TIMEOUT_SECONDS:-20}
  # Panel backup and restore (feature `panel_backup`, common/backups.py).
  # Blank by default: a deployment that has not enabled the feature mounts
  # neither volume, every read in that module then fails closed, and the
  # settings page does not show the section at all.
  DOLPHIN_BACKUP_ROOT: ${DOLPHIN_BACKUP_ROOT:-}
  DOLPHIN_RESTORE_SPOOL: ${DOLPHIN_RESTORE_SPOOL:-}
  DOLPHIN_BACKUP_UPLOAD_MAX_BYTES: ${DOLPHIN_BACKUP_UPLOAD_MAX_BYTES:-2147483648}

services:
  db:
    image: ${DOLPHIN_POSTGRES_IMAGE:?DOLPHIN_POSTGRES_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: unless-stopped
    entrypoint: ["sh", "/ops/postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_parameter_max_length=0
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_duration=off
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_INIT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INIT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/ops/postgres-entrypoint.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-bootstrap:
    image: ${DOLPHIN_POSTGRES_IMAGE:?DOLPHIN_POSTGRES_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INIT_USER: ${POSTGRES_INIT_USER}
      POSTGRES_INIT_PASSWORD: ${POSTGRES_INIT_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/ops/bootstrap-postgres.sh"]
    volumes:
      - ./scripts/bootstrap-postgres.sh:/ops/bootstrap-postgres.sh:ro
    networks:
      - backend

  migrate:
    image: ${DOLPHIN_APP_IMAGE:?DOLPHIN_APP_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      <<: *django-environment
      DOLPHIN_DATABASE_ROLE: migration
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    volumes:
      - static_data:/app/staticfiles
      - ${DOLPHIN_DEPLOYMENT_MANIFEST_PATH:?DOLPHIN_DEPLOYMENT_MANIFEST_PATH must point at the signed deployment manifest}:/profile/manifest.json:ro
    networks:
      - backend

  db-finalize:
    image: ${DOLPHIN_POSTGRES_IMAGE:?DOLPHIN_POSTGRES_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INIT_USER: ${POSTGRES_INIT_USER}
      POSTGRES_INIT_PASSWORD: ${POSTGRES_INIT_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "/ops/bootstrap-postgres.sh"]
    volumes:
      - ./scripts/bootstrap-postgres.sh:/ops/bootstrap-postgres.sh:ro
    networks:
      - backend

  backup:
    image: ${DOLPHIN_POSTGRES_IMAGE:?DOLPHIN_POSTGRES_IMAGE must be one reviewed repository@sha256:digest reference}
    profiles: ["backup"]
    restart: "no"
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      HOME: /tmp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      POSTGRES_BACKUP_ROOT: /backups
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:?POSTGRES_BACKUP_RETENTION_DAYS must be an approved whole-day value}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/ops/backup-postgres.sh"]
    volumes:
      - ./scripts/backup-postgres.sh:/ops/backup-postgres.sh:ro
      - backup_data:/backups
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - backend

  # Expired session rows are not removed by Django on their own: the store only
  # ignores them, so `django_session` grows for the life of the deployment and
  # keeps expired session data at rest indefinitely. Behind a profile so it
  # never starts with the stack; the operator runs it from cron. See
  # docs/ops/CLIENT1_LINUX_STAGING_GUIDE.md section 18.
  session-cleanup:
    image: ${DOLPHIN_APP_IMAGE:?DOLPHIN_APP_IMAGE must be one reviewed repository@sha256:digest reference}
    profiles: ["maintenance"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      <<: *django-environment
      DOLPHIN_DATABASE_ROLE: app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "clearsessions"]
    volumes:
      - ${DOLPHIN_DEPLOYMENT_MANIFEST_PATH:?DOLPHIN_DEPLOYMENT_MANIFEST_PATH must point at the signed deployment manifest}:/profile/manifest.json:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - backend

  # Group and scheduled SMS (product-owner request 2026-09-09). Same shape and
  # same reasoning as `session-cleanup` above: behind the `maintenance` profile
  # so it never starts with the stack, and run from cron — this deployment has
  # no task queue, and a periodically-run management command is the pattern
  # already established here rather than new infrastructure.
  #
  # Every five minutes is a sensible starting cadence; the SMS page itself also
  # flushes a few due recipients when it is opened, so a deployment that has not
  # wired this yet still sends. That flush only runs when somebody opens the
  # page, though — a campaign scheduled for 03:00 waits for the first visitor
  # unless this job exists. See docs/ops/TIARA_SMS_SETUP.md.
  scheduled-sms:
    image: ${DOLPHIN_APP_IMAGE:?DOLPHIN_APP_IMAGE must be one reviewed repository@sha256:digest reference}
    profiles: ["maintenance"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      <<: *django-environment
      DOLPHIN_DATABASE_ROLE: app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "send_scheduled_sms"]
    volumes:
      - ${DOLPHIN_DEPLOYMENT_MANIFEST_PATH:?DOLPHIN_DEPLOYMENT_MANIFEST_PATH must point at the signed deployment manifest}:/profile/manifest.json:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - backend

  # The privileged half of panel backup and restore (feature `panel_backup`).
  #
  # Behind its own profile, and that is the whole safety story rather than a
  # convenience: a deployment that does not start this container cannot have
  # its database replaced from a web page, no matter what the panel shows or
  # who is signed in. Starting it is a deliberate, written decision the
  # runbook spells out, the same way section 4.6 already requires one before
  # a manual disaster restore.
  #
  # It holds the init credentials the `web` container must never hold, and
  # its only input is a request file on the spool volume — no socket, no
  # port, and the internal `backend` network only. See scripts/backup-agent.sh
  # and common/backups.py.
  backup-agent:
    image: ${DOLPHIN_POSTGRES_IMAGE:?DOLPHIN_POSTGRES_IMAGE must be one reviewed repository@sha256:digest reference}
    profiles: ["backup-agent"]
    restart: unless-stopped
    # `postgres`, but in the *application's* group. Both containers have to
    # read what the other wrote — the panel lists and downloads archives the
    # agent published, the agent reads the upload the panel spooled — and
    # they run as different users (10001 here, 70 there). A shared group and
    # `umask 027` in the agent is what makes that work without making a
    # database dump world-readable. `scripts/prepare-backup-volume.sh
    # --share-with-panel` sets the two directories up to match, once.
    user: "postgres:${DOLPHIN_PANEL_GID:-10001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      HOME: /tmp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INIT_USER: ${POSTGRES_INIT_USER}
      POSTGRES_INIT_PASSWORD: ${POSTGRES_INIT_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      BACKUP_ROOT: /backups
      SPOOL_ROOT: /spool
      BACKUP_AGENT_POLL_SECONDS: ${BACKUP_AGENT_POLL_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/ops/backup-agent.sh"]
    volumes:
      - ./scripts/backup-agent.sh:/ops/backup-agent.sh:ro
      # Mounted but never run by the agent itself: it is the one-shot
      # `prepare-backup-volume.sh --share-with-panel` runs here as root,
      # because this is the only service that mounts both volumes.
      - ./scripts/share-backup-volume.sh:/ops/share-backup-volume.sh:ro
      - backup_data:/backups
      - restore_spool:/spool
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - backend

  web:
    image: ${DOLPHIN_APP_IMAGE:?DOLPHIN_APP_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: unless-stopped
    read_only: true
    # The application already runs as the non-root `appuser` and binds 8000, so
    # it needs no Linux capability at all and can never gain one. `db` and
    # `nginx` keep theirs deliberately: both official entrypoints start as root
    # to chown their data directory / bind 443 and then drop privileges, so
    # dropping ALL there would stop the container from starting.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      <<: *django-environment
      DOLPHIN_DATABASE_ROLE: app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    depends_on:
      db-finalize:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/staticfiles:ro
      - ${DOLPHIN_DEPLOYMENT_MANIFEST_PATH:?DOLPHIN_DEPLOYMENT_MANIFEST_PATH must point at the signed deployment manifest}:/profile/manifest.json:ro
      # Backups, **read-only**, so the panel can list and download them and
      # cannot forge an archive beside the genuine ones. The spool is the
      # only writable path the application has, and the only thing it can
      # put there is a request the agent then re-validates from scratch.
      - backup_data:/backups:ro
      - restore_spool:/spool
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - backend
      - frontend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: ${DOLPHIN_NGINX_IMAGE:?DOLPHIN_NGINX_IMAGE must be one reviewed repository@sha256:digest reference}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOLPHIN_PUBLIC_HOST: ${DOLPHIN_PUBLIC_HOST}
      DOLPHIN_HSTS_HEADER: ${DOLPHIN_HSTS_HEADER}
      NGINX_ENVSUBST_FILTER: DOLPHIN_PUBLIC_HOST|DOLPHIN_HSTS_HEADER
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/static:ro
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ./nginx/write-stop-off.conf
        target: /etc/nginx/write-stop.conf
        read_only: true
      - type: bind
        source: ${DOLPHIN_TLS_CERT_PATH:?DOLPHIN_TLS_CERT_PATH must name the approved certificate chain file}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${DOLPHIN_TLS_KEY_PATH:?DOLPHIN_TLS_KEY_PATH must name the approved private key file}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:?POSTGRES_DATA_VOLUME must name the approved database volume}
  backup_data:
    external: true
    name: ${POSTGRES_BACKUP_VOLUME:?POSTGRES_BACKUP_VOLUME must name the approved backup volume}
  # Deliberately *not* external and deliberately not the backup volume: it
  # holds only in-flight requests and the upload being restored, it is the
  # one path the web container may write to, and keeping it separate is what
  # stops a compromised panel from writing something that looks like a
  # published backup.
  restore_spool:
  static_data:

networks:
  backend:
    internal: true
  frontend: {}
