include /etc/nginx/write-stop.conf;

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
log_format kariz_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
error_log /dev/stderr alert;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    add_header X-Request-ID $request_id always;
    error_page 418 =503 @write_stopped_http;

    if ($kariz_write_stop) {
        return 418;
    }

    location @write_stopped_http {
        internal;
        default_type application/json;
        return 503 '{"detail":"Writes are temporarily unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location = /health/live/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://${KARIZ_PUBLIC_HOST}$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name ${KARIZ_PUBLIC_HOST};
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 64k;
    access_log /dev/stdout kariz_json;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security "${KARIZ_HSTS_HEADER}" always;
    error_page 429 = @throttled;
    error_page 413 = @payload_too_large;
    error_page 418 =503 @write_stopped;
    error_page 502 503 504 = @upstream_unavailable;

    if ($kariz_write_stop) {
        return 418;
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"detail":"Request body is too large.","error":{"code":"payload_too_large","request_id":"$request_id"}}';
    }

    location @throttled {
        internal;
        default_type application/json;
        return 429 '{"detail":"Too many requests.","error":{"code":"throttled","request_id":"$request_id"}}';
    }

    location @upstream_unavailable {
        internal;
        default_type application/json;
        return 503 '{"detail":"Service unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location @write_stopped {
        internal;
        default_type application/json;
        return 503 '{"detail":"Writes are temporarily unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location = /health/live/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires -1;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /admin/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }
}
