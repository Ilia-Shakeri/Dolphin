include /etc/nginx/write-stop.conf;

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
# Readiness runs a database query and answers before authentication, so it is
# reachable by anyone who can reach the port. The rate is set for monitoring —
# one probe every few seconds from several checkers is comfortably inside it —
# and only a flood is refused. The liveness route below is served by nginx
# itself, touches nothing, and stays unlimited so a container health check can
# never be throttled into reporting the stack unhealthy.
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=60r/m;
log_format kariz_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
error_log /dev/stderr alert;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    add_header X-Request-ID $request_id always;
    error_page 418 =503 @write_stopped_http;

    if ($kariz_write_stop) {
        return 418;
    }

    location @write_stopped_http {
        internal;
        default_type application/json;
        return 503 '{"detail":"Writes are temporarily unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location = /health/live/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://${KARIZ_PUBLIC_HOST}$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name ${KARIZ_PUBLIC_HOST};
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE in config/settings.py, which is sized
    # from the largest document the API accepts (200 lines with full Persian
    # descriptions, ~220 KB). Keep the two in step: a lower value here refuses
    # documents the application would have taken.
    client_max_body_size 256k;
    access_log /dev/stdout kariz_json;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;
    add_header X-Request-ID $request_id always;
    # An empty KARIZ_HSTS_HEADER emits no header at all: nginx skips add_header
    # when the value is an empty string. That is the IP-only / self-signed
    # staging case, where DJANGO_SECURE_HSTS_SECONDS=0 and pinning the browser
    # for a year would lock the operator out of their own certificate warning.
    # config/production_env.py refuses any disagreement between the two.
    add_header Strict-Transport-Security "${KARIZ_HSTS_HEADER}" always;
    error_page 429 = @throttled;
    error_page 413 = @payload_too_large;
    error_page 418 =503 @write_stopped;
    error_page 502 503 504 = @upstream_unavailable;

    if ($kariz_write_stop) {
        return 418;
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"detail":"Request body is too large.","error":{"code":"payload_too_large","request_id":"$request_id"}}';
    }

    location @throttled {
        internal;
        default_type application/json;
        return 429 '{"detail":"Too many requests.","error":{"code":"throttled","request_id":"$request_id"}}';
    }

    location @upstream_unavailable {
        internal;
        default_type application/json;
        return 503 '{"detail":"Service unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location @write_stopped {
        internal;
        default_type application/json;
        return 503 '{"detail":"Writes are temporarily unavailable.","error":{"code":"server_error","request_id":"$request_id"}}';
    }

    location = /health/live/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires -1;
    }

    # The application's own health routes. `/health/live/` above is answered by
    # nginx and needs no upstream; these reach Django, and readiness queries the
    # database, so they are bounded.
    location ^~ /api/v1/health/ {
        limit_req zone=health_limit burst=20 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }

    # The routes that take a real file rather than a JSON document. The
    # server-wide client_max_body_size is sized from the largest *document* the
    # API accepts, which is far smaller than a spreadsheet; without this the edge
    # would refuse an upload the application is willing to read. The bound here
    # matches FILE_UPLOAD_MAX_MEMORY_SIZE in config/settings.py — keep the two in
    # step, and note that it is still a bound: a bigger file is a data-migration
    # task, not a panel action.
    location ~ ^/api/v1/(products|customers)/import-xlsx/$ {
        client_max_body_size 5m;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }

    # Django Admin is a server-administration plane and is never served on the
    # customer-facing ingress. `^~` wins over the regex locations below, so no
    # /admin/ request is ever proxied to the application.
    #
    # The application is the first layer: `ENABLE_DJANGO_ADMIN` is false by
    # default, so the route does not exist there either. Both layers must be
    # changed deliberately for admin to become reachable.
    #
    # P14 will replace this blanket deny with a management-network allowlist
    # once the target-site survey establishes the real VPN topology. The
    # allowlist CIDR is deliberately NOT guessed here; see
    # docs/ops/TARGET_SITE_SURVEY.md.
    location ^~ /admin/ {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Strict-Transport-Security;
    }
}
