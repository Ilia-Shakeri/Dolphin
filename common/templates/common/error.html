{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="description" content="سامانه مدیریت ارتباط با مشتری فروش‌بین">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>خطای سامانه | ForooshBin</title>
    <link rel="icon" href="{% static 'common/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'common/forooshbin.css' %}">
</head>
<body>
<div class="d-flex flex-column flex-center flex-column-fluid p-10" style="min-height:100vh">
    <section class="card mb-5 mb-xl-8" aria-labelledby="error-title"><div class="card-body">
        <p class="text-primary fw-bold fs-7 mb-1">ForooshBin | فروش‌بین</p>
        <p class="fs-2hx fw-bold text-danger mb-3">{{ status }}</p>
        <h1 id="error-title">{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="btn btn-primary" href="/">بازگشت به خانه</a>
    </div></section>
</div>
</body>
</html>
