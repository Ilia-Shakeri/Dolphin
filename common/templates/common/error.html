{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="description" content="سامانه مدیریت ارتباط با مشتری فروش‌بین">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>خطای سامانه | ForooshBin</title>
    <link rel="icon" href="{% static 'kariz-brand/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'common/kariz.css' %}">
</head>
<body>
<main class="auth-shell">
    <section class="card error-card" aria-labelledby="error-title">
        <p class="eyebrow">ForooshBin | فروش‌بین</p>
        <p class="status-code">{{ status }}</p>
        <h1 id="error-title">{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="button" href="/">بازگشت به خانه</a>
    </section>
</main>
</body>
</html>
