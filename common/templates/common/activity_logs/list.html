{% extends "common/base.html" %}
{% block title %}رویدادهای سامانه{% endblock %}
{% block page_id %}activity-logs{% endblock %}
{% block content %}
<section class="d-flex flex-wrap flex-stack align-items-center mb-6"><div><p class="text-primary fw-bold fs-7 mb-1">مشاهده فقط‌خواندنی</p><h1>رویدادهای سامانه</h1></div></section>
<section class="card mb-5 mb-xl-8"><div class="card-body">
    <form id="activity-log-search-form" action="{% url 'common_ui:activity-logs' %}" method="get" class="d-flex flex-wrap align-items-center gap-3 mb-5">
        <label class="sr-only" for="activity-log-search">جستجوی رویداد</label><input class="form-control form-control-solid w-auto flex-grow-1" id="activity-log-search" name="search" type="search" placeholder="عملیات، نوع مورد یا شناسه درخواست">
        <label class="sr-only" for="activity-log-ordering">مرتب‌سازی</label><select class="form-select form-select-solid w-auto flex-grow-1" id="activity-log-ordering" name="ordering"><option value="-created_at">تازه‌ترین</option><option value="created_at">قدیمی‌ترین</option></select>
        <button class="btn btn-light" type="submit">اعمال</button>
    </form>
    <div id="activity-logs-loading" class="text-center text-muted py-10">در حال دریافت رویدادها…</div><div id="activity-logs-empty" class="text-center text-muted py-10" hidden>رویدادی پیدا نشد.</div>
    <div id="activity-logs-table-wrap" class="table-responsive" hidden><table class="table align-middle table-row-dashed fs-6 gy-4 mb-0"><thead><tr><th>عملیات</th><th>نوع مورد</th><th>شناسه</th><th>نقش ثبت‌کننده</th><th>زمان</th><th>عملیات</th></tr></thead><tbody id="activity-logs-table-body"></tbody></table></div>
    <nav id="activity-logs-pagination" class="d-flex align-items-center justify-content-center gap-4 mt-5" aria-label="صفحه‌بندی" hidden><button id="activity-logs-prev" class="btn btn-light" type="button">قبلی</button><span id="activity-logs-page-label"></span><button id="activity-logs-next" class="btn btn-light" type="button">بعدی</button></nav>
</div></section>
{% endblock %}
